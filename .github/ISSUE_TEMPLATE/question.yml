name: Question about the methodology
description: Ask how a calculation works, why a number looks the way it does, or what an assumption means.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions about how the model works are welcome. First, a quick check: **[METHODOLOGY.md](../blob/main/METHODOLOGY.md)** documents every engine, assumption, and known limitation in detail — your answer may already be there, especially for "why is my success rate lower than other calculators" (that's intentional and explained).

        **Do not paste real financial figures or an API key** — this issue is public.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This question contains no real personal financial data and no API key.
          required: true

  - type: checkboxes
    id: checked-methodology
    attributes:
      label: Checked the methodology?
      options:
        - label: I've skimmed METHODOLOGY.md and my question isn't already answered there.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What would you like to understand? If it's about a specific number, describe the situation with rounded or example figures.
    validations:
      required: true
